<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplikasi LHK KPU</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --border: #3a3a3a; --primary: #3b82f6; --danger: #cf6679; --success: #03dac6; --table-bg: #252525; }
    * { box-sizing: border-box; } 
    body { margin: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--text); }
    .wrap { max-width: 1200px; margin: auto; padding: 16px; }
    .top-actions { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 12px; }
    .top-actions button { padding: 6px 12px; font-size: 11px; border-radius: 6px; }
    .hero { background: linear-gradient(135deg, #1f2937, #111827); border-radius: 20px; padding: 22px; border: 1px solid var(--border); }
    h1 { font-size: 24px; margin: 0 0 5px; color: #fff; } 
    .meta { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 18px; }
    .meta .item { background: rgba(255,255,255,.05); padding: 11px; border-radius: 12px; border: 1px solid var(--border); } 
    .meta small { display: block; opacity: .7; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; } 
    .meta b { font-size: 14px; color: #fff; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-top: 16px; }
    .toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 15px;}
    button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; font: inherit; transition: opacity .2s; }
    button:hover { opacity: .85; } 
    .primary { background: var(--primary); color: #fff; } .secondary { background: #333; color: #fff; border: 1px solid #555; } .danger { background: var(--danger); color: #000; } .success { background: var(--success); color: #000; }
    input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font: inherit; background: #2c2c2c; color: #fff; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    .status { font-size: 13px; color: var(--success); margin-top: 10px; font-weight: bold; }
    
    .table-container { overflow-x: auto; border-radius: 10px; margin-top: 10px; border: 1px solid #555; background: var(--table-bg); }
    
    /* PERBAIKAN: CSS tabel dibatasi hanya untuk tabel Tampilan Web (#lhkTable) */
    /* Ini mencegah CSS web membocorkan warna hitam dan memaksakan min-width 850px pada tabel PDF */
    #lhkTable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 850px; } 
    #lhkTable th, #lhkTable td { border: 1px solid #555; padding: 12px 10px; text-align: center; vertical-align: middle; } 
    #lhkTable th { background: #1a1a1a; color: #fff; font-weight: bold; }
    
    .action-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; } .action-group button { padding: 8px; font-size: 11px; flex: 1; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 99; } .modal.show { display: flex; }
    .dialog { background: var(--card); width: min(650px, 100%); max-height: 94vh; overflow: auto; border-radius: 18px; padding: 25px; border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .full { grid-column: 1 / -1; } .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #9e9e9e; }
    #loginScreen { max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px; border-radius: 20px; } #mainScreen { display: none; }
    #pdfFrame { width: 100%; flex: 1; border: none; border-radius: 10px; background: #fff; min-height: 60vh; margin-bottom:15px; }
  </style>
</head>
<body>

<div id="loginScreen">
  <h2 style="text-align:center;margin-top:0">Login LHK</h2>
  <div class="field full" style="margin-bottom:15px"><label>Username / Nama</label><input id="lSheet" placeholder="Contoh: Fredy"></div>
  <div class="field full"><label>Password</label><input type="password" id="lPass" placeholder="Masukkan password"></div>
  <button class="primary" style="width:100%;margin-top:20px;padding:12px" onclick="doLogin()">🔒 MASUK</button>
</div>

<div class="wrap" id="mainScreen">
  <div id="adminPanel" style="display:none; background:#1f2937; padding:15px; border-radius:15px; margin-bottom:15px; border: 1px solid var(--primary);">
    <h3 style="margin-top:0; color:#fff; font-size:16px;">🛡️ Panel Akses Pimpinan</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <select id="bawahanSelect" style="flex:1; min-width:200px;"><option value="">-- Daftar Bawahan --</option></select>
      <button class="primary" onclick="lihatLhkBawahan()">👁️ Lihat LHK</button>
      <button class="secondary" onclick="kembaliKeLhkSendiri()">🏠 LHK Saya</button>
    </div>
  </div>

  <section class="hero">
    <div class="top-actions">
      <button class="secondary" onclick="openSettings()">⚙️ Pengaturan</button>
      <button class="danger" onclick="doLogout()">🚪 Keluar</button>
    </div>
    <div><h1 id="pNama">Memuat...</h1><div id="pModeTampilan" style="color:var(--success);font-size:14px;font-weight:bold;">Data Sendiri</div></div>
    <div class="meta">
      <div class="item"><small>Jabatan</small><b id="pJabatan">-</b></div>
      <div class="item"><small>Unit Kerja</small><b id="pUnit">-</b></div>
      <div class="item"><small>Bulan</small><b id="pBulan">-</b></div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <div><button class="primary" onclick="generateBulan()">📅 Generate Bulan</button> <button class="secondary" onclick="openAdd()">➕ Baris Baru</button></div>
      <div><button class="success" onclick="previewPdf()">👁️ Preview & Unduh PDF</button></div>
    </div>
    <div class="status" id="statusMsg"></div>
    <div class="table-container">
      <table id="lhkTable">
        <thead>
          <tr>
            <th width="40">NO</th>
            <th width="150">HARI / TANGGAL</th>
            <th width="100">PUKUL</th>
            <th>URAIAN KEGIATAN</th>
            <th width="120">JUMLAH REALISASI<br>BUKTI DUKUNG</th>
            <th width="80">LINK BUKTI DUKUNG</th>
            <th width="100">KETERANGAN</th>
            <th width="200">AKSI</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal" id="modalForm"><div class="dialog">
  <h2 id="modalTitle">Edit Kegiatan</h2>
  <input type="hidden" id="arrayIndex"> <input type="hidden" id="insertAfter">
  <div class="grid">
    <div class="field"><label>Nomor (Otomatis)</label><input id="nomor" type="number" readonly style="background:#2a2a2a; color:#888;" title="Auto Generate"></div>
    <div class="field" id="tglField"><label>Hari / Tanggal</label>
      <input type="date" id="tanggalRaw" onchange="formatTanggalIndo()"><input type="hidden" id="tanggalStr">
    </div>
    <div class="field full" id="waktuContainer"><label>Pukul Kegiatan</label>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="time" id="pukulAwal" style="flex:1;"><span style="color:#fff;"> s/d </span><input type="time" id="pukulAkhir" style="flex:1;">
      </div>
    </div>
    <div class="field"><label>Jumlah Bukti</label><input id="jumlah" placeholder="1 Kegiatan"></div>
    <div class="field"><label>Link Bukti (Opsional)</label><input id="link"></div>
    <div class="field full"><label>Keterangan (Opsional)</label><input id="keterangan" placeholder="-"></div>
    <div class="field full"><label>Uraian Kegiatan</label><textarea id="uraian" rows="5"></textarea></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button class="secondary" onclick="closeModal('modalForm')">Batal</button><button class="primary" onclick="saveRow()">💾 SIMPAN</button></div>
</div></div>

<div class="modal" id="modalSettings"><div class="dialog">
  <h2>Pengaturan Profil LHK</h2>
  <div class="grid">
    <div class="field full"><label>Bulan Laporan</label><select id="sBulan"></select></div>
    <div class="field"><label>Username (Singkat)</label><input id="sUsername"></div>
    <div class="field"><label>Ganti Password</label><input type="text" id="sPassword" placeholder="Abaikan jika tidak diganti"></div>
    <div class="field full" style="margin-top:10px;border-top:1px solid #444;padding-top:15px"><label style="color:#fff"><b>DATA PEGAWAI</b></label></div>
    <div class="field"><label>Nama Lengkap</label><input id="sNama"></div><div class="field"><label>NIP Pegawai</label><input id="sNip"></div>
    <div class="field"><label>Jabatan</label><input id="sJabatan"></div>
    <div class="field"><label>Unit Kerja</label>
      <select id="sUnit">
        <option value="">-- Pilih Unit Kerja --</option>
        <option value="Subbagian Keuangan Umum KPU Kab. Labuhanbatu Utara">Subbagian Keuangan Umum KPU Kab. Labuhanbatu Utara</option>
        <option value="Subbagian Teknis dan Parmas KPU Kab. Labuhanbatu Utara">Subbagian Teknis dan Parmas KPU Kab. Labuhanbatu Utara</option>
        <option value="Subbagian Rendatin KPU Kab. Labuhanbatu Utara">Subbagian Rendatin KPU Kab. Labuhanbatu Utara</option>
        <option value="Subbagian Hukum dan SDM KPU Kab. Labuhanbatu Utara">Subbagian Hukum dan SDM KPU Kab. Labuhanbatu Utara</option>
      </select>
    </div>
    <div class="field full" style="margin-top:10px;border-top:1px solid #444;padding-top:15px">
      <label style="color:#fff"><b>INFO ATASAN</b></label>
      <select id="sPilihAtasan" onchange="pilihAtasan()">
        <option value="">-- Pilih Atasan --</option>
        <option value="keuangan">Kasubbag Keuangan, Umum, dan Logistik</option>
        <option value="teknis">Kasubbag Teknis dan Parmas</option>
        <option value="rendatin">Kasubbag Rendatin</option>
        <option value="hukum">Kasubbag Hukum dan SDM</option>
        <option value="sekretaris">Sekretaris</option>
      </select>
    </div>
    <div class="field full"><label>Jabatan Atasan</label><input id="sAtasanTitle"></div>
    <div class="field"><label>Nama Atasan</label><input id="sAtasanName"></div><div class="field"><label>NIP Atasan</label><input id="sAtasanNip"></div>
    <div class="field"><label style="color:var(--primary)">TTD Atasan (Kiri)</label><input type="file" id="sTtdAtasanFile" accept="image/png, image/jpeg" style="padding:8px"></div>
    <div class="field"><label style="color:var(--success)">TTD Anda (Kanan)</label><input type="file" id="sTtdFile" accept="image/png, image/jpeg" style="padding:8px"></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button class="secondary" onclick="closeModal('modalSettings')">Batal</button><button class="primary" onclick="saveSettings()">💾 SIMPAN PENGATURAN</button></div>
</div></div>

<div class="modal" id="modalPdf">
  <div class="dialog" style="width: 95%; height: 95vh; max-width: 1000px; display:flex; flex-direction:column;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 style="margin:0">Preview LHK</h2><button class="danger" onclick="closeModal('modalPdf')">✖ Tutup</button>
    </div>
    <iframe id="pdfFrame"></iframe>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="secondary" style="flex:1; padding:14px;" onclick="eksekusiUnduhPdf()">⬇️ UNDUH LOKAL</button>
      <button class="primary" style="flex:1; padding:14px;" onclick="eksekusiSimpanKeDrive()">☁️ SIMPAN KE DRIVE</button>
    </div>
  </div>
</div>

<script>
let cred={loginId:'', password:'', sheetName:''}, profile={}, rows=[], ttdB64=null, ttdAtasanB64=null;
let base64PdfUtama = null, targetSheetView = null; 

const DATA_ATASAN = {
  'keuangan': { title: 'Kasubbag Keuangan, Umum, dan Logistik', name: 'Muhammad Ridwan', nip: '196905211994111001' },
  'teknis': { title: 'Kasubbag Teknis dan Parmas', name: 'Chairi Asman', nip: '198309162009021007' },
  'rendatin': { title: 'Kasubbag Rendatin', name: 'Fachrur Razi Juned', nip: '198206072009021006' },
  'hukum': { title: 'Kasubbag Hukum dan SDM', name: 'Muhammad Rajali Siregar', nip: '198703072020121003' },
  'sekretaris': { title: 'Sekretaris', name: 'Muhammad Azmir Daulay', nip: '198003152009121003' }
};

function initBulanDropdown() {
  const sb = document.getElementById('sBulan'), n = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  let opt = ''; for(let y=2025; y<=2027; y++) for(let i=0; i<12; i++) opt += `<option value="${n[i]} ${y}">${n[i]} ${y}</option>`;
  sb.innerHTML = opt;
} initBulanDropdown();

async function callApi(action, payload={}) {
  payload.action = action; payload.loginId = cred.loginId; payload.password = cred.password;
  payload.aktorLogin = cred.sheetName; payload.targetSheet = targetSheetView; 
  const res = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); 
  const data = await res.json();
  if (data.error) throw new Error(data.error); return data;
}

function doLogin() {
  cred.loginId = document.getElementById('lSheet').value; cred.password = document.getElementById('lPass').value;
  if(!cred.loginId || !cred.password) return alert("Wajib diisi!");
  callApi('login').then((res) => {
    cred.sheetName = res.sheetName; 
    document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainScreen').style.display = 'block'; 
    loadData();
  }).catch(e => { alert(e); });
}

function doLogout() {
  cred = {loginId:'', password:'', sheetName:''}; targetSheetView = null;
  document.getElementById('mainScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'block';
}

function loadData() {
  setMsg("Memuat data...", "white");
  callApi('initial').then(d => {
    profile = d.profile; rows = d.rows;
    document.getElementById('pNama').textContent = profile.nama || profile.username; 
    document.getElementById('pJabatan').textContent = profile.jabatan || '-'; 
    document.getElementById('pUnit').textContent = profile.unitKerja || '-';
    document.getElementById('pBulan').textContent = profile.bulanLaporan || '-';
    
    if(!targetSheetView) { cekAdminBawahan(); document.getElementById('pModeTampilan').textContent = "Data Anda Sendiri"; } 
    else { document.getElementById('pModeTampilan').textContent = `Melihat LHK: ${profile.username}`; }
    
    renderRowsUI(); setMsg("Data termuat.");
  }).catch(e => setMsg("Error: "+e, "red"));
}

function cekAdminBawahan() {
  callApi('getBawahan').then(d => {
    if (d.role === 'Super Admin' || d.role === 'Admin') {
      const panel = document.getElementById('adminPanel'); const sel = document.getElementById('bawahanSelect');
      if (d.bawahan && d.bawahan.length > 0) {
        panel.style.display = 'block';
        sel.innerHTML = '<option value="">-- Pilih LHK Bawahan --</option>' + d.bawahan.map(b => `<option value="${b.sheet}">${b.name} (${b.unit || b.role})</option>`).join('');
      }
    }
  });
}

function lihatLhkBawahan() { const sel = document.getElementById('bawahanSelect').value; if (!sel) return alert("Pilih bawahan!"); targetSheetView = sel; loadData(); }
function kembaliKeLhkSendiri() { targetSheetView = null; loadData(); }

// MERGE ROWSPAN UI HTML
function renderRowsUI() {
  const tb = document.getElementById('tbody');
  if(!rows.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px">Belum ada kegiatan.</td></tr>'; return; }
  
  let html = '';
  for (let i = 0; i < rows.length; i++) {
    let r = rows[i];
    let isLanjutan = !r.nomor && !r.tanggal;
    
    if (!isLanjutan) {
      let rowspan = 1;
      for (let j = i + 1; j < rows.length; j++) {
        if (!rows[j].nomor && !rows[j].tanggal) rowspan++; else break;
      }
      html += `<tr>
        <td rowspan="${rowspan}" style="text-align:center; vertical-align:middle; background:#1e1e1e; border: 1px solid #555;">${r.nomor}</td>
        <td rowspan="${rowspan}" style="text-align:center; vertical-align:middle; background:#1e1e1e; font-weight:bold; border: 1px solid #555;">${r.tanggal}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.pukul}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.uraian.replace(/\n/g,'<br>')}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.jumlah||''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.link?'<a href="'+r.link+'" target="_blank" style="color:var(--primary);">Buka</a>':''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.keterangan||''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">
          <div class="action-group"><button class="secondary" onclick="openEdit(${i})">✏️</button><button class="primary" onclick="addLanjutan(${i})">➕ Lanjut</button><button class="danger" onclick="hapusRow(${i})">🗑️</button></div>
        </td>
      </tr>`;
    } else {
      html += `<tr>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.pukul}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.uraian.replace(/\n/g,'<br>')}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.jumlah||''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.link?'<a href="'+r.link+'" target="_blank" style="color:var(--primary);">Buka</a>':''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">${r.keterangan||''}</td>
        <td style="text-align:center; vertical-align:middle; border: 1px solid #555;">
          <div class="action-group"><button class="secondary" onclick="openEdit(${i})">✏️</button><button class="primary" onclick="addLanjutan(${i})">➕ Lanjut</button><button class="danger" onclick="hapusRow(${i})">🗑️</button></div>
        </td>
      </tr>`;
    }
  }
  tb.innerHTML = html;
}

function formatTanggalIndo() {
  const dRaw = document.getElementById('tanggalRaw').value; if(!dRaw) return;
  const d = new Date(dRaw); const names = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('tanggalStr').value = `${d.getDate()} ${names[d.getMonth()]} ${d.getFullYear()}`;
}

function openSettings() {
  document.getElementById('sUsername').value = profile.username || '';
  document.getElementById('sBulan').value = profile.bulanLaporan || 'Oktober 2026';
  document.getElementById('sNama').value = profile.nama || ''; 
  document.getElementById('sNip').value = profile.nip || ''; 
  document.getElementById('sJabatan').value = profile.jabatan || ''; 
  document.getElementById('sUnit').value = profile.unitKerja || ''; 
  document.getElementById('sAtasanTitle').value = profile.atasanTitle || ''; 
  document.getElementById('sAtasanName').value = profile.atasanName || ''; 
  document.getElementById('sAtasanNip').value = profile.atasanNip || ''; 
  ttdB64 = profile.ttdBase64 || null;
  ttdAtasanB64 = profile.ttdAtasanBase64 || null;
  document.getElementById('modalSettings').classList.add('show');
}

function pilihAtasan() { const val = document.getElementById('sPilihAtasan').value; if(val && DATA_ATASAN[val]) { document.getElementById('sAtasanTitle').value = DATA_ATASAN[val].title; document.getElementById('sAtasanName').value = DATA_ATASAN[val].name; document.getElementById('sAtasanNip').value = DATA_ATASAN[val].nip; } }

document.getElementById('sTtdFile').addEventListener('change', e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => ttdB64 = ev.target.result; r.readAsDataURL(f); });
document.getElementById('sTtdAtasanFile').addEventListener('change', e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => ttdAtasanB64 = ev.target.result; r.readAsDataURL(f); });

function saveSettings() {
  setMsg("Menyimpan profil...", "white"); closeModal('modalSettings');
  const p = { username: document.getElementById('sUsername').value, password: document.getElementById('sPassword').value, bulanLaporan: document.getElementById('sBulan').value, nama: document.getElementById('sNama').value, nip: document.getElementById('sNip').value, jabatan: document.getElementById('sJabatan').value, unitKerja: document.getElementById('sUnit').value, atasanTitle: document.getElementById('sAtasanTitle').value, atasanName: document.getElementById('sAtasanName').value, atasanNip: document.getElementById('sAtasanNip').value };
  if(p.username) cred.loginId = p.username; if(p.password) cred.password = p.password;
  callApi('saveProfile', { profile: p, ttdBase64: ttdB64, ttdAtasanBase64: ttdAtasanB64 }).then(loadData).catch(e => alert(e));
}

function generateBulan() {
  if(!confirm("Buat baris tanggal otomatis untuk bulan ini? (Data lama bulan ini akan dihapus)")) return;
  const bulanStr = profile.bulanLaporan || 'Oktober 2026';
  const names = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
  let m = 9, y = 2026;
  for(let i=0; i<names.length; i++) { if(bulanStr.toLowerCase().includes(names[i])) { m = i; break; } }
  const match = bulanStr.match(/\b20\d{2}\b/); if(match) y = Number(match[0]);
  
  const days = new Date(y, m+1, 0).getDate(); const newRows = []; let no = 1;
  for(let d = 1; d <= days; d++) {
      const date = new Date(y, m, d);
      if(date.getDay() !== 0 && date.getDay() !== 6) {
          newRows.push({ nomor: no++, tanggal: `${d} ${names[m].charAt(0).toUpperCase() + names[m].slice(1)} ${y}`, pukul: '', uraian: '', jumlah: '', link: '', keterangan: '' });
      }
  }
  rows = newRows; setMsg("Menyimpan Data..."); callApi('syncRows', { rows }).then(loadData);
}

function openAdd() { 
  document.getElementById('modalTitle').textContent = 'Tambah Baris Baru'; document.getElementById('arrayIndex').value = ''; document.getElementById('insertAfter').value='';
  let maxNum = 0; rows.forEach(r => { if(r.nomor && !isNaN(r.nomor)) maxNum = Math.max(maxNum, Number(r.nomor)); });
  document.getElementById('nomor').value = maxNum + 1; 
  document.getElementById('tanggalRaw').readOnly = false; document.getElementById('tanggalRaw').value = '';
  document.getElementById('tanggalStr').value=''; document.getElementById('uraian').value=''; document.getElementById('pukulAwal').value=''; document.getElementById('pukulAkhir').value=''; document.getElementById('keterangan').value=''; 
  document.getElementById('waktuContainer').style.display = 'flex'; document.getElementById('modalForm').classList.add('show'); 
}

function openEdit(index) { 
  const r = rows[index];
  document.getElementById('modalTitle').textContent = 'Isi Kegiatan'; document.getElementById('arrayIndex').value = index; document.getElementById('insertAfter').value='';
  document.getElementById('nomor').value = r.nomor; document.getElementById('tanggalStr').value = r.tanggal; 
  if(!r.nomor) { document.getElementById('tanggalRaw').style.display = 'none'; document.getElementById('waktuContainer').style.display = 'none'; } else { document.getElementById('tanggalRaw').style.display = 'block'; document.getElementById('waktuContainer').style.display = 'flex'; }
  document.getElementById('pukulAwal').value=''; document.getElementById('pukulAkhir').value='';
  if(r.pukul) {
     const splitJam = r.pukul.replace(' WIB','').split('-');
     if(splitJam[0]) document.getElementById('pukulAwal').value = splitJam[0].trim();
     if(splitJam[1]) document.getElementById('pukulAkhir').value = splitJam[1].trim();
  }
  document.getElementById('uraian').value = r.uraian; document.getElementById('jumlah').value = r.jumlah; document.getElementById('link').value = r.link; document.getElementById('keterangan').value = r.keterangan || '';
  document.getElementById('modalForm').classList.add('show'); 
}

function addLanjutan(index) {
  document.getElementById('modalTitle').textContent = 'Tambah Lanjutan'; document.getElementById('arrayIndex').value = ''; document.getElementById('insertAfter').value = index; 
  document.getElementById('nomor').value=''; document.getElementById('tanggalStr').value=''; 
  document.getElementById('tanggalRaw').style.display = 'none'; document.getElementById('waktuContainer').style.display = 'none'; 
  document.getElementById('uraian').value=''; document.getElementById('pukulAwal').value=''; document.getElementById('pukulAkhir').value=''; document.getElementById('jumlah').value=''; document.getElementById('link').value=''; document.getElementById('keterangan').value=''; 
  document.getElementById('modalForm').classList.add('show'); 
}

function saveRow() { 
  closeModal('modalForm'); setMsg("Menyimpan baris...", "white"); 
  const index = document.getElementById('arrayIndex').value; const insertAfterVal = document.getElementById('insertAfter').value; 
  
  let jamGabungan = ''; 
  if(document.getElementById('pukulAwal').value && document.getElementById('pukulAkhir').value) {
      jamGabungan = document.getElementById('pukulAwal').value + ' - ' + document.getElementById('pukulAkhir').value + ' WIB';
  }
  
  const newData = { nomor: document.getElementById('nomor').value, tanggal: document.getElementById('tanggalStr').value, pukul: jamGabungan, uraian: document.getElementById('uraian').value, jumlah: document.getElementById('jumlah').value, link: document.getElementById('link').value, keterangan: document.getElementById('keterangan').value };
  if(index !== '') { rows[index] = newData; } else if(insertAfterVal !== '') { rows.splice(Number(insertAfterVal) + 1, 0, newData); } else { rows.push(newData); }
  callApi('syncRows', { rows }).then(loadData);
}

function hapusRow(index) { if(confirm("Hapus baris ini?")) { setMsg("Menghapus...", "white"); rows.splice(index, 1); callApi('syncRows', { rows }).then(loadData); } }

function previewPdf() { 
  setMsg("Sedang memproses PDF Presisi A4...", "var(--warning)"); 
  
  let rowsHtml = '';
  for (let i = 0; i < rows.length; i++) {
    let r = rows[i];
    let isLanjutan = !r.nomor && !r.tanggal;
    
    if (!isLanjutan) {
      let rowspan = 1;
      for (let j = i + 1; j < rows.length; j++) {
        if (!rows[j].nomor && !rows[j].tanggal) rowspan++;
        else break;
      }
      rowsHtml += `<tr>
        <td rowspan="${rowspan}" style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.nomor||''}</td>
        <td rowspan="${rowspan}" style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.tanggal||''}</td>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.pukul||''}</td>
        <td style="padding:6px 4px; text-align:left; vertical-align:middle; border:1px solid black; color:black;">${r.uraian?r.uraian.replace(/\n/g,'<br>'):''}</td>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.jumlah||''}</td>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black; word-wrap:break-word; word-break:break-all;">${r.link?'<a href="'+r.link+'" style="color:blue; text-decoration:none;">Buka</a>':''}</td>
        <td style="padding:6px 4px; text-align:left; vertical-align:middle; border:1px solid black; color:black;">${r.keterangan||''}</td>
      </tr>`;
    } else {
      rowsHtml += `<tr>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.pukul||''}</td>
        <td style="padding:6px 4px; text-align:left; vertical-align:middle; border:1px solid black; color:black;">${r.uraian?r.uraian.replace(/\n/g,'<br>'):''}</td>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black;">${r.jumlah||''}</td>
        <td style="padding:6px 4px; text-align:center; vertical-align:middle; border:1px solid black; color:black; word-wrap:break-word; word-break:break-all;">${r.link?'<a href="'+r.link+'" style="color:blue; text-decoration:none;">Buka</a>':''}</td>
        <td style="padding:6px 4px; text-align:left; vertical-align:middle; border:1px solid black; color:black;">${r.keterangan||''}</td>
      </tr>`;
    }
  }

  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  let blnStr = profile.bulanLaporan || 'Oktober 2026';
  let mIdx = 9; let yyyy = 2026;
  for(let i=0; i<months.length; i++) { if(blnStr.toLowerCase().includes(months[i].toLowerCase())) { mIdx = i; break; } }
  const matchYear = blnStr.match(/\b20\d{2}\b/); if(matchYear) yyyy = Number(matchYear[0]);
  const lastDay = new Date(yyyy, mIdx + 1, 0).getDate();
  const dateLabel = `Aek Kanopan, ${lastDay} ${months[mIdx]} ${yyyy}`;

  const ttdKiri = profile.atasanTitle && !profile.jabatan.toLowerCase().includes('sekretaris') ? 
    `Diketahui/Disetujui<br>${profile.atasanTitle}<br><div style="height:70px; display:flex; align-items:center; justify-content:center; margin:5px 0;"><img src="${profile.ttdAtasanBase64 || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}" style="max-height:70px; max-width:150px; opacity:${profile.ttdAtasanBase64?1:0};"></div>${profile.atasanName}<br>NIP. ${profile.atasanNip}` : '';
    
  const ttdKanan = `${dateLabel}<br>${profile.jabatan}<br><div style="height:70px; display:flex; align-items:center; justify-content:center; margin:5px 0;"><img src="${profile.ttdBase64 || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}" style="max-height:70px; max-width:150px; opacity:${profile.ttdBase64?1:0};"></div>${profile.nama || profile.username}<br>NIP. ${profile.nip || '-'}`;

  const htmlContent = `
  <div style="width: 760px; max-width:100%; margin: 0 auto; font-family: Arial, sans-serif; font-size: 11px; color: black; background: white;">
    
    <div style="text-align: center; font-weight: bold; font-size: 12px; margin-bottom: 20px; line-height: 1.4;">
      REKAP LAPORAN CAPAIAN KINERJA<br>
      APARATUR SIPIL NEGARA (ASN)<br>
      KPU PROVINSI SUMATERA UTARA
    </div>

    <table style="width: 100%; border: none; font-size: 11px; margin-bottom: 5px; border-collapse: collapse;">
      <tr>
        <td style="width: 100px; padding: 2px 0; border: none; text-align: left; color: black;">NAMA</td>
        <td style="width: 15px; padding: 2px 0; border: none; text-align: center; color: black;">:</td>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">${profile.nama || profile.username || '-'}</td>
      </tr>
      <tr>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">NIP</td>
        <td style="padding: 2px 0; border: none; text-align: center; color: black;">:</td>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">${profile.nip || '-'}</td>
      </tr>
      <tr>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">JABATAN</td>
        <td style="padding: 2px 0; border: none; text-align: center; color: black;">:</td>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">${profile.jabatan || '-'}</td>
      </tr>
      <tr>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">UNIT KERJA</td>
        <td style="padding: 2px 0; border: none; text-align: center; color: black;">:</td>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">${profile.unitKerja || '-'}</td>
      </tr>
      <tr>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">BULAN</td>
        <td style="padding: 2px 0; border: none; text-align: center; color: black;">:</td>
        <td style="padding: 2px 0; border: none; text-align: left; color: black;">${profile.bulanLaporan || '-'}</td>
      </tr>
    </table>

    <div style="font-size: 11px; margin-bottom: 10px; text-align: left; text-transform: uppercase; color: black;">
      JAM KERJA PERHARI MINIMAL 7 JAM 30 MENIT
    </div>

    <table style="width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; word-wrap: break-word; border: 1px solid black; background: white;">
      <colgroup>
        <col style="width: 4%;">
        <col style="width: 14%;">
        <col style="width: 14%;">
        <col style="width: 28%;">
        <col style="width: 10%;">
        <col style="width: 16%;">
        <col style="width: 14%;">
      </colgroup>
      <thead>
        <tr>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">NO</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">HARI/TANGGAL</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">PUKUL</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">URAIAN KEGIATAN</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">JUMLAH REALISASI<br>BUKTI DUKUNG</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">LINK BUKTI DUKUNG</th>
          <th style="padding: 5px; text-align: center; vertical-align: middle; border: 1px solid black; color: black; background: white; font-weight: bold;">KETERANGAN</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>

    <table style="width: 100%; margin-top: 30px; font-size: 11px; border: none; page-break-inside: avoid; border-collapse: collapse;">
      <tr>
        <td style="width: 50%; text-align: center; vertical-align: top; border: none; padding: 0; color: black;">${ttdKiri}</td>
        <td style="width: 50%; text-align: center; vertical-align: top; border: none; padding: 0; color: black;">${ttdKanan}</td>
      </tr>
    </table>
  </div>
  `;

  const opt = {
    margin:       10, 
    filename:     'LHK.pdf',
    image:        { type: 'jpeg', quality: 1 },
    html2canvas:  { scale: 2, useCORS: true, windowWidth: 800 }, // Penyesuaian agar stabil di HP
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(htmlContent).outputPdf('datauristring').then(function(pdfBase64) {
      base64PdfUtama = pdfBase64;
      document.getElementById('pdfFrame').src = base64PdfUtama;
      document.getElementById('modalPdf').classList.add('show');
      setMsg("Preview siap. Pilih Unduh atau Simpan.", "var(--success)");
  }).catch(e => { 
      setMsg("Error merender PDF: " + e, "red"); 
  });
}

function eksekusiUnduhPdf() {
  if(!base64PdfUtama) return alert("Dokumen belum siap.");
  const a = document.createElement('a'); a.href = base64PdfUtama; a.download = `LHK_${profile.username}_${profile.bulanLaporan}.pdf`; 
  document.body.appendChild(a); a.click(); a.remove(); setMsg("PDF berhasil diunduh.", "var(--success)"); closeModal('modalPdf');
}

function eksekusiSimpanKeDrive() {
  if(!base64PdfUtama) return alert("Dokumen belum siap.");
  setMsg("Mengupload ke Google Drive...", "var(--warning)");
  callApi('simpanPdfKeDrive', { bulanLaporan: profile.bulanLaporan, pdfBase64: base64PdfUtama }).then(res => {
    setMsg("Berhasil disimpan ke Drive Bulanan!", "var(--success)"); alert("Sukses tersimpan di Google Drive LHK."); closeModal('modalPdf');
  }).catch(e => alert("Gagal mengupload: " + e));
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function setMsg(m, c="var(--success)") { const sm = document.getElementById('statusMsg'); sm.textContent = m; sm.style.color = c; }
</script>
</body>
</html>
